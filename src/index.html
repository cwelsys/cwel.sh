<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connor Welsh</title>
<meta name="description" content="Connor Welsh, software developer in Arlington, VA.">
<meta name="theme-color" content="#1e1e2e">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<output id="out" role="log" aria-live="polite">
<pre id="login" class="dim" data-built="{{built}}">Last login: {{login}} from localhost</pre>
<h1 id="banner" class="d"><span aria-hidden="true">               _      _
 ____ __ _____| |  __| |_
/ _\ V  V / -_) |_(_-&lt; ' \
\__|\_/\_/\___|_(_)__/_||_|</span><span class="sr">cwel.sh</span></h1>
<pre class="cmd"><span aria-hidden="true"><span class="d">~</span>
<span class="p">❯</span></span> ls</pre>
<pre id="ls" class="nav">{{ls}}</pre>
<pre class="cmd"><span aria-hidden="true"><span class="d">~</span>
<span class="p">❯</span></span> whoami</pre>
<pre id="about">Connor Welsh</pre>
</output>
<pre class="d" aria-hidden="true">~</pre>
<form id="f" autocomplete="off">
<span class="p" aria-hidden="true">❯</span>&nbsp;<label class="sr" for="cmd">Command</label><span id="line"><input id="cmd" type="text" spellcheck="false" autocapitalize="off" aria-describedby="hint"></span>
</form>
<p id="hint" class="dim">type <span class="c">help</span>, or just use the links.</p>
</main>
<template id="man">{{man}}</template>
<script src="/logos.js"></script>
<script src="/shell.js"></script>
</body>
</html>
